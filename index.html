<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#08080a" />
  <title>2-Chamber Roulette</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23080809'/%3E%3Ccircle cx='8' cy='8' r='5' fill='none' stroke='%23a11a1f' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='1.4' fill='%23ded8c8'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bone: #ded8c8;
      --bone-bright: #efeadd;
      --ash: #8b877c;
      --dimmer: #5f5c55;
      --blood: #a11a1f;
      --ink: #08080a;
      --hud: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #17181a 0, #0b0c0e 55%, #050506 100%);
      font-family: var(--hud);
      color: var(--bone);
      letter-spacing: .04em;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #bootStatus {
      position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; gap: 16px;
      padding: 24px; background: #070708; color: var(--bone); text-align: center; overflow-wrap: anywhere;
    }
    #bootStatus[hidden] { display: none; }
    #bootStatus > div:first-child { font-size: 12px; letter-spacing: .38em; text-transform: uppercase; color: var(--ash); }
    #bootStatus::after {
      content: ""; width: 120px; height: 1px; margin: 0 auto;
      background: linear-gradient(90deg, transparent, var(--blood), transparent);
      box-shadow: 0 0 18px rgba(161, 26, 31, .65);
    }
    #bootError { max-width: min(720px, 90vw); color: #ff9a8f; font: 12px/1.6 var(--hud); white-space: pre-wrap; text-align: left; letter-spacing: .02em; }
    body::after {
      content: ""; position: fixed; inset: 0; z-index: 5; pointer-events: none;
      box-shadow: inset 0 0 16vw 4vw rgba(0, 0, 0, .55);
      background: radial-gradient(circle at 50% 46%, transparent 38%, rgba(0, 0, 0, .22) 80%, rgba(0, 0, 0, .5) 100%);
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    button, input, select { border-radius: 0; letter-spacing: .04em; }
    button { transition: filter 120ms ease, transform 120ms ease, border-color 120ms ease; font-family: inherit; }
    button:not(:disabled):hover { filter: brightness(1.28); }
    button:not(:disabled):active { transform: translateY(1px); }
    button:disabled { cursor: default; }
    input, select { font-family: inherit; }
    #lobbyBox { box-shadow: 0 30px 90px rgba(0, 0, 0, .9), inset 0 0 0 1px rgba(222, 216, 200, .05); }
    ::selection { background: var(--blood); color: #fff; }
    @media (pointer: coarse) {
      canvas { height: 100dvh; touch-action: manipulation; }
      #lobby { overflow-y: auto; padding: 12px; }
      #lobbyBox { max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow-y: auto; }
      #partyEntries { min-width: 0 !important; }
      input, select { font-size: 16px; }
      #msg { font-size: 11px !important; line-height: 1.35; letter-spacing: .2em !important; }
      #ui { bottom: calc(28px + env(safe-area-inset-bottom)) !important; gap: 10px !important; }
      #pick { bottom: calc(96px + env(safe-area-inset-bottom)) !important; left: 12px !important; right: 12px; transform: none !important; }
      #ui button, #pick button, #resetRow button, #lobbyBox button {
        min-height: 44px; touch-action: manipulation;
      }
      #lobbyBox { width: min(100%, 460px); min-width: 0 !important; max-width: 100% !important; }
    }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="bootStatus" role="status">
    <div>FORTUNA // LOADING TABLE</div>
    <div id="bootError" role="alert" hidden></div>
  </div>
  <script type="module">
    const bootStatus = document.getElementById('bootStatus');
    const bootError = document.getElementById('bootError');
    const showBootError = (reason) => {
      bootStatus.hidden = false;
      bootError.hidden = false;
      bootError.textContent = reason?.stack || reason?.message || String(reason);
    };

    window.addEventListener('error', (event) => {
      if (event.error || event.message) showBootError(event.error || event.message);
    });
    window.addEventListener('unhandledrejection', (event) => showBootError(event.reason));

    import('./main.js')
      .then(() => { bootStatus.hidden = true; })
      .catch(showBootError);
  </script>
</body>
</html>
