<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>2-Chamber Roulette</title>
  <style>
    body { margin: 0; overflow: hidden; background: radial-gradient(circle at 50% 40%, #24191b 0, #100e11 58%, #070609 100%); font-family: Georgia, "Times New Roman", serif; color: #ddd4c2; user-select: none; }
    #bootStatus { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; gap: 12px; padding: 24px; background: #09090b; color: #ddd4c2; text-align: center; overflow-wrap: anywhere; }
    #bootStatus[hidden] { display: none; }
    #bootError { max-width: min(720px, 90vw); color: #ff9a8f; font: 13px/1.5 monospace; white-space: pre-wrap; text-align: left; }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      box-shadow: inset 0 0 10vw 2vw rgba(0,0,0,.32);
      background: radial-gradient(circle at 50% 46%, transparent 42%, rgba(0,0,0,.08) 78%, rgba(0,0,0,.2) 100%);
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    button, input, select { border-radius: 1px; letter-spacing: .04em; }
    button { transition: filter 120ms ease, transform 120ms ease, box-shadow 120ms ease; }
    button:not(:disabled):hover { filter: brightness(1.18); box-shadow: 0 0 12px rgba(205,181,131,.18); }
    button:not(:disabled):active { transform: translateY(1px); }
    #lobbyBox {
      box-shadow: 0 18px 70px rgba(0,0,0,.82), inset 0 0 0 1px rgba(210,190,145,.12);
      background: linear-gradient(145deg, rgba(18,16,18,.98), rgba(7,7,9,.98)) !important;
    }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    input { font-family: inherit; }
    @media (pointer: coarse) {
      * { box-sizing: border-box; }
      canvas { height: 100dvh; touch-action: manipulation; }
      #lobby { overflow-y: auto; padding: 12px; }
      #lobbyBox { box-sizing: border-box; max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow-y: auto; }
      #partyEntries { min-width: 0 !important; }
      input, select { font-size: 16px; }
      #msg { font-size: 11px !important; line-height: 1.35; }
      #ui {
        left: 50% !important;
        top: auto !important;
        bottom: calc(84px + env(safe-area-inset-bottom)) !important;
        transform: translateX(-50%) !important;
        flex-direction: row !important;
        gap: 10px !important;
      }
      #ui button, #pick button, #resetRow button, #lobbyBox button {
        min-height: 44px;
        touch-action: manipulation;
      }
      #pick {
        left: 10px !important;
        right: 10px;
        bottom: max(10px, env(safe-area-inset-bottom)) !important;
        width: auto;
        transform: none !important;
        align-items: center;
        gap: 8px;
      }
      #resetRow { bottom: max(10px, env(safe-area-inset-bottom)) !important; }
      #lobbyBox { width: min(100%, 440px); min-width: 0 !important; max-width: 100% !important; }
    }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="bootStatus" role="status">
    <div>LOADING ROULETTE TABLE…</div>
    <div id="bootError" role="alert" hidden></div>
  </div>
  <script type="module">
    const bootStatus = document.getElementById('bootStatus');
    const bootError = document.getElementById('bootError');
    const showBootError = (reason) => {
      bootStatus.hidden = false;
      bootError.hidden = false;
      bootError.textContent = reason?.stack || reason?.message || String(reason);
    };

    window.addEventListener('error', (event) => {
      if (event.error || event.message) showBootError(event.error || event.message);
    });
    window.addEventListener('unhandledrejection', (event) => showBootError(event.reason));

    import('./main.js')
      .then(() => { bootStatus.hidden = true; })
      .catch(showBootError);
  </script>
</body>
</html>
